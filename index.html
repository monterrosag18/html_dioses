<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo Dioses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="decor-svg" aria-hidden="true" style="display:flex;justify-content:center;margin-bottom:14px;">
            <!-- Ankh estilizado (SVG inline, decorativo) -->
            <svg width="92" height="92" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <linearGradient id="g1" x1="0" x2="1">
                        <stop offset="0" stop-color="#FFD24A" />
                        <stop offset="1" stop-color="#D4AF37" />
                    </linearGradient>
                    <radialGradient id="g2" cx="30%" cy="30%">
                        <stop offset="0" stop-color="#00B3A3" stop-opacity="0.18" />
                        <stop offset="1" stop-color="#00B3A3" stop-opacity="0" />
                    </radialGradient>
                </defs>

                <!-- fondo circular sutil -->
                <circle cx="60" cy="36" r="22" fill="url(#g2)" />

                <!-- lazo del ankh -->
                <ellipse cx="60" cy="34" rx="18" ry="14" fill="url(#g1)" stroke="#8c6b10" stroke-width="2" />

                <!-- asta vertical -->
                <rect x="56" y="44" width="8" height="36" rx="3" fill="url(#g1)" stroke="#8c6b10" stroke-width="2" />

                <!-- brazos horizontales -->
                <rect x="44" y="58" width="32" height="8" rx="3" fill="url(#g1)" stroke="#8c6b10" stroke-width="2" />

                <!-- base decorativa -->
                <rect x="52" y="74" width="16" height="8" rx="2" fill="#8c6b10" opacity="0.95" />
            </svg>
        </div>
        <h1>Equipo Dioses</h1>
        <p class="subtitle">Portafolios de nuestro equipo</p>
        
        <div class="links-section">
            <div class="link-card">
                <span class="member-name">Miembro 1</span>
                <span class="status">(Enlace pendiente)</span>
            </div>
            <div class="link-card">
                <span class="member-name">Miembro 2</span>
                <span class="status">(Enlace pendiente)</span>
            </div>
            <div class="link-card">
                <span class="member-name">Miembro 3</span>
                <span class="status">(Enlace pendiente)</span>
            </div>
            <div class="link-card">
                <span class="member-name">Miembro 4</span>
                <span class="status">(Enlace pendiente)</span>
            </div>
        </div>

        <footer>
            <p>Equipazo en construcción</p>
        </footer>
    </div>
</body>
</html>
